<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0810">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
:root{--ink:#0b0810;--paper:#fff8eb;--muted:#d5c5b5;--gold:#f2c66d;--orange:#e78336;--line:rgba(242,198,109,.28)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--paper);background:radial-gradient(circle at 15% 12%,rgba(139,53,95,.28),transparent 28rem),radial-gradient(circle at 85% 72%,rgba(231,131,54,.16),transparent 26rem),var(--ink);font:17px/1.7 Georgia,serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(var(--gold) .7px,transparent .7px);background-size:22px 22px;mask-image:linear-gradient(to bottom,black,transparent 72%)}.site-header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(11,8,16,.92);backdrop-filter:blur(14px)}.header-inner{width:min(1160px,calc(100% - 32px));margin:auto;min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{color:var(--paper);text-decoration:none;font:700 15px/1.1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.brand span{color:var(--gold);display:block;margin-top:4px;font-size:10px;letter-spacing:.3em}.site-nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.site-nav a{color:var(--muted);padding:7px 10px;border-radius:999px;text-decoration:none;font:700 12px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.site-nav a:hover{color:var(--ink);background:var(--gold)}.page-shell{width:min(1030px,calc(100% - 32px));margin:44px auto 56px}.journal-card{position:relative;overflow:hidden;padding:clamp(25px,5vw,58px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(35,23,37,.96),rgba(18,13,24,.96));box-shadow:0 26px 80px rgba(0,0,0,.35)}.journal-card:before{content:'S';position:absolute;top:-120px;right:-25px;color:rgba(242,198,109,.045);font:700 390px/.8 Georgia,serif;pointer-events:none}.journal-card>*{position:relative}h1,h2,h3{color:var(--paper);line-height:1.18;font-family:Arial,Helvetica,sans-serif}h1{margin:0 0 18px;font-size:clamp(2.35rem,6vw,4.9rem);letter-spacing:-.055em}h1:after{content:'';display:block;width:96px;height:4px;margin-top:20px;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--orange))}h2{margin:48px 0 14px;color:var(--gold);font-size:clamp(1.38rem,3vw,2rem)}h3{margin:28px 0 8px;color:var(--orange)}p,li{max-width:78ch}a{color:var(--gold);text-underline-offset:3px}.journal-card a[style]{display:inline-flex!important;align-items:center;justify-content:center;margin:5px 8px 5px 0!important;padding:11px 16px!important;border:1px solid rgba(242,198,109,.65)!important;border-radius:999px!important;color:var(--ink)!important;background:linear-gradient(135deg,var(--gold),var(--orange))!important;font:800 12px/1 Arial,sans-serif!important;letter-spacing:.08em!important;text-decoration:none!important;text-transform:uppercase!important}strong{color:#ffe1a1}code{padding:.12em .36em;border-radius:5px;color:#ffe7b1;background:rgba(242,198,109,.1);font:.9em/1.5 Consolas,monospace}pre{overflow:auto;margin:22px 0;padding:20px;border:1px solid rgba(242,198,109,.16);border-radius:14px;background:#0c0910}pre code{padding:0;background:none}table{width:100%;margin:24px 0;border-collapse:collapse;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.13)}th,td{padding:13px 15px;border-bottom:1px solid rgba(242,198,109,.12);text-align:left}th{color:var(--gold);font-family:Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}iframe,video{display:block;width:100%!important;max-width:900px;height:auto;margin:25px auto;border:1px solid var(--gold)!important;border-radius:16px!important;background:#08060a;box-shadow:0 14px 32px rgba(0,0,0,.35)}iframe{aspect-ratio:9/5}li::marker{color:var(--gold)}.site-footer{width:min(1030px,calc(100% - 32px));margin:0 auto 34px;color:var(--muted);font:12px/1.5 Arial,sans-serif;letter-spacing:.08em;text-align:center;text-transform:uppercase}@media(max-width:700px){.header-inner{padding:14px 0;align-items:flex-start;flex-direction:column;gap:12px}.site-nav{justify-content:flex-start}.site-nav a{padding:7px 8px;font-size:10px}.page-shell{margin-top:24px}.journal-card{border-radius:17px}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="{{ '/' | relative_url }}">Steven's Lab<span>Midnight Projects</span></a><nav class="site-nav" aria-label="Main navigation"><a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/development-journal.html' | relative_url }}">Alarm</a><a href="{{ '/3d-scanner-project.html' | relative_url }}">3D Scanner</a><a href="{{ '/video-games.html' | relative_url }}">Video Games</a><a href="{{ '/cube-dash-v4.html' | relative_url }}">Play</a></nav></div></header>
<main class="page-shell"><article class="journal-card">{{ content }}</article></main>
<footer class="site-footer">Steven's Innovator Journal · Built with curiosity, code, and late-night ideas.</footer>
</body></html>
